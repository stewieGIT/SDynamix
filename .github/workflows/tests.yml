name: Execute and Validate Test Suite

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-math-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compiler Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake doxygen graphviz gcovr

      - name: Configure CMake Engine (Debug Coverage)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -O0 -g"   \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Compile Library and Test Target
        run: |
          cmake --build build

      - name: Execute CTest Harness Guardrail
        run: |
          ctest --test-dir build --output-on-failure

      - name: Generate Coverage Report
        run: gcovr --root . --filter 'src/' --html-details coverage.html build

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html